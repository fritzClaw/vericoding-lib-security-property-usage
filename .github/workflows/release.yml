name: release

# Publish a GitHub Release with every binary of the workspace, built for
# Apple Silicon (aarch64-apple-darwin, e.g. Mac M1), in either way:
#   - push a tag `vX.Y.Z` on main, or
#   - run this workflow manually on main with input `version: vX.Y.Z`
#     (the release step then creates the tag at the built commit).
# Nothing is published unless the full gate passes on that same machine.
# PRs touching this workflow, and manual runs without a version, are dry runs
# (build + artifact only).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 (empty: dry run). Run on main."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: gate + build (macOS arm64)
    runs-on: macos-15  # Apple Silicon
    timeout-minutes: 60
    env:
      # Runs on every Apple Silicon Mac with macOS 11+, whatever the runner's macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Verus release
        uses: actions/cache@v6
        with:
          path: ~/.verus
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verus-toolchain.env') }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verus-toolchain.env', 'Cargo.lock') }}-${{ hashFiles('katas/**', 'lib-*/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verus-toolchain.env', 'Cargo.lock') }}-

      - name: Install Verus (arm64-macos)
        run: |
          scripts/install-verus.sh
          scripts/install-verus.sh --print-env | sed -E 's/^export PATH="([^:]*):.*/\1/' >> "$GITHUB_PATH"

      - name: Gate (scripts/verify.sh)
        run: |
          python3 -m unittest discover -s tools
          scripts/verify.sh

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$INPUT_VERSION" ]]; then
            [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::manual releases must run on main"; exit 1; }
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find binary targets
        id: bins
        env:
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          bins=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          for p in json.load(sys.stdin)["packages"]:
              for t in p["targets"]:
                  if "bin" in t["kind"]:
                      print(t["name"])')
          if [ -z "$bins" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "::error::no binary targets to release"; exit 1; fi
            echo "::notice::no binary targets yet; dry run stops after the gate"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        if: steps.bins.outputs.any == 'true'
        run: cargo build --release --locked --workspace --bins

      - name: Sign, check and package
        if: steps.bins.outputs.any == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          bins=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          for p in json.load(sys.stdin)["packages"]:
              for t in p["targets"]:
                  if "bin" in t["kind"]:
                      print(t["name"])')
          pkg="$REPO_NAME-$VERSION-aarch64-apple-darwin"
          mkdir -p "dist/$pkg"
          for b in $bins; do
            cp "target/release/$b" "dist/$pkg/$b"
            codesign --force --sign - "dist/$pkg/$b"   # ad-hoc signature
            codesign --verify --verbose "dist/$pkg/$b"
            [ "$(lipo -archs "dist/$pkg/$b")" = "arm64" ] || { echo "$b is not arm64"; exit 1; }
          done
          # Add a smoke test per binary here once the application has one, e.g.
          #   [ "$("dist/$pkg/<bin>" --version)" = "..." ]
          tar -czf "dist/$pkg.tar.gz" -C dist "$pkg"
          (cd dist && shasum -a 256 "$pkg.tar.gz" > SHA256SUMS && cat SHA256SUMS)
          echo "$bins" > dist/BINARIES

      - uses: actions/upload-artifact@v4
        if: steps.bins.outputs.any == 'true'
        with:
          name: macos-arm64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/BINARIES
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build-macos-arm64
    if: needs.build-macos-arm64.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: dist

      - name: Release notes
        env:
          VERSION: ${{ needs.build-macos-arm64.outputs.version }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          pkg="$REPO_NAME-$VERSION-aarch64-apple-darwin"
          {
            echo "Binaries for **macOS on Apple Silicon** (M1 and later), \`aarch64-apple-darwin\`."
            echo
            echo "Every binary is built from code whose core is formally verified with Verus."
            echo "The full gate (spec lock, Verus \`--no-cheating\`, tests) passed on the build machine."
            echo
            echo "## Binaries"
            sed 's/^/- `/; s/$/`/' dist/BINARIES
            echo
            echo "## Katas"
            python3 tools/vc.py status --markdown
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -LO https://github.com/$REPO/releases/download/$VERSION/$pkg.tar.gz"
            echo "curl -LO https://github.com/$REPO/releases/download/$VERSION/SHA256SUMS"
            echo "shasum -a 256 -c SHA256SUMS"
            echo "tar -xzf $pkg.tar.gz"
            echo "ls $pkg/"
            echo '```'
            echo
            echo "The binaries are ad-hoc signed, not notarized. Files downloaded with a browser are"
            echo "quarantined by Gatekeeper (\"cannot verify the developer\"). Remove the flag once:"
            echo
            echo '```sh'
            echo "xattr -d com.apple.quarantine $pkg/*"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-macos-arm64.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_flag=(--verify-tag)              # tag already pushed
          else
            tag_flag=(--target "$GITHUB_SHA")    # manual run: tag the built commit
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "$VERSION (macOS Apple Silicon)" \
            --notes-file notes.md \
            "${tag_flag[@]}"
